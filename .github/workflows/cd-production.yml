name: CD Production

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions: {}

jobs:
  remote-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for cloud-server
        id: check
        run: echo "exists=$(test -d cloud-server && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Deploy production environment
        if: steps.check.outputs.exists == 'true'
