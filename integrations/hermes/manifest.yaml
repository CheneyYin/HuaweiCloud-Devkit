manifest_version: 1
name: huaweicloud-devkit
description: >
  Huawei Cloud DevKit provides MCP tools, KooCLI guidance, and safety
  guardrails for Huawei Cloud services within Hermes Agent. Service skills
  (ECS, OBS, VPC, RDS, CCE, ModelArts, and more) ship as server data and are
  disclosed through the MCP tools (huaweicloud_list_packs,
  huaweicloud_list_skills, huaweicloud_retrieve_skill) instead of
  ~/.hermes/skills/ copies; the stdio MCP server instructions state skillRoot
  (the tree's location) at initialize — the default load path is
  action-first: attempt the direct read, the attempt itself is the
  reachability check — and huaweicloud_list_skills is the effective
  catalog (which skills are ENABLED is pack-gated and can change at runtime),
  with huaweicloud_retrieve_skill as the fallback when the attempted read
  fails or is denied.

source: https://github.com/huaweicloud/huaweicloud-devkit

transport:
  type: stdio
  command: 'node'
  args: ['plugins/huaweicloud-core/dist/mcp-server.js']
  env:
    HUAWEICLOUD_AGENT_TOOLKIT_MODE: 'local'

install:
  type: git
  url: https://github.com/huaweicloud/huaweicloud-devkit
  bootstrap:
    - 'npm ci'
    - 'npm run build'
    - 'node plugins/huaweicloud-core/dist/setup-cli.js install --target hermes --skip-mcp-server'

auth:
  type: none

tools:
  default_enabled: []

post_install: |
  Huawei Cloud DevKit installed successfully!

  What was set up:
    • MCP tools (every registered tool of the devkit server) → config.yaml
    • Safety hooks (pre_tool_call terminal guard) → config.yaml
    • Safety policy + skills tree (server data) → ~/.hermes/huaweicloud-plugins/

  Skills are MCP-disclosed: ask the agent to call huaweicloud_list_packs,
  browse the effective catalog with huaweicloud_list_skills (which skills are
  ENABLED is pack-gated and can change at runtime), or route a task with
  huaweicloud_service_catalog, then attempt the direct read —
  read the recommended skill's files directly under the skillRoot the MCP
  server instructions state at initialize (and the list_skills payload
  carries), no reachability pre-check — falling back to
  huaweicloud_retrieve_skill when the attempted read fails or is denied
  (the loader needs no file access). The six core
  meta-skills (huaweicloud-*) are additionally installed as native copies in
  ~/.hermes/skills for system-prompt visibility.

  Next steps:
    1. Configure credentials: npx huaweicloud-devkit auth init
    2. Restart Hermes Agent session (MCP tools load on restart)
    3. Verify: hermes doctor
    4. Try: "Help me check my ECS instances on Huawei Cloud" or "Deploy this website to Huawei Cloud OBS"
